<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link href="{{ '/pagefind/pagefind-ui.css' | relative_url }}" rel="stylesheet">

  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="seal">功夫</span>
      <span>
        <h1 class="site-title">{{ site.title }}</h1>
        <p class="site-tagline">{{ site.tagline }}</p>
      </span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Entradas</a>
      <a href="{{ '/buscar/' | relative_url }}">Buscar</a>
      <a href="{{ '/biblioteca/' | relative_url }}">Biblioteca</a>
      {% for cat in site.categories_list %}
      <a href="{{ '/categoria/' | relative_url }}{{ cat | slugify: "ascii" }}/">{{ cat }}</a>
{% endfor %}
    </nav>
  </header>

  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <p>{{ site.title }} — cuaderno abierto de práctica. Sello y trazos hechos con cariño, no con IP ajena.</p>
  </footer>
</body>
</html>
